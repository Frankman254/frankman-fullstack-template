# SQL Server opcional (perfil local-db). Si ya tienes un contenedor en 1433 (p. ej. sqlserver-dev),
# no levantes este servicio: conecta la API a localhost:1433 con tu .env.
#
# Uso: docker compose --profile local-db up -d
# Puerto host por defecto 14333 → evita choque con otra instancia en 1433.

services:
  sqlserver:
    profiles: ["local-db"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fullstack-starter-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong@Passw0rd}
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
